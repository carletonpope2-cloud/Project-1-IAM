AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM CloudFormation'

# IAM Groups and related resources
Resources:
 # Developer IAM Group
  DeveloperIAMGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      GroupName: 'DeveloperCFNGroup'
      Description: 'Full EC2 and S3 access'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
    
  DeveloperUserToGroupAddition:
    Type: 'AWS::IAM::UserToGroupAddition'
    Properties:
      GroupName: !Ref DeveloperIAMGroup
      Users:
        - !Ref DeveloperUser
    
  DeveloperIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'DeveloperCFNRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'


# Operations IAM Group
  OperationsIAMGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      GroupName: 'OperationsCFNGroup'
      Description: 'Full infrastructure access'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'

  OperationsUserToGroupAddition:
    Type: 'AWS::IAM::UserToGroupAddition'
    Properties:
      GroupName: !Ref OperationsIAMGroup
      Users:
        - !Ref OperationsUser

  OperationsIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'OperationsCFNRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'


# Finance Manager IAM Group
  FinanceManagerIAMGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      GroupName: 'FinanceManagerCFNGroup'
      Description: 'Cost management and billing access'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/Billing'

  FinanceManagerUserToGroupAddition:
    Type: 'AWS::IAM::UserToGroupAddition'
    Properties:
      GroupName: !Ref FinanceManagerIAMGroup
      Users:
        - !Ref FinanceManagerUser
    
  FinanceManagerIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'FinanceManagerCFNRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/Billing'


# Data Analyst IAM Group
  DataAnalystIAMGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      GroupName: 'DataAnalystCFNGroup'
      Description: 'Read-only access to data, S3, RDS, and CloudWatch'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/AmazonRDSReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess'

  DataAnalystUserToGroupAddition:
    Type: 'AWS::IAM::UserToGroupAddition'
    Properties:
      GroupName: !Ref DataAnalystIAMGroup
      Users:
        - !Ref DataAnalystUser

  DataAnalystIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'DataAnalystCFNRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/AmazonRDSReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess'